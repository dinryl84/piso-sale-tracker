name: Check Piso Sale

on:
  schedule:
    # Runs every hour, 8:00 AM to 8:00 PM Philippine time (UTC+8)
    # PHT 8am = UTC 0:00, PHT 8pm = UTC 12:00
    - cron: "0 0-12 * * *"
  workflow_dispatch: {}  # lets you trigger it manually from the Actions tab

permissions:
  contents: write

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Run checker
        env:
          NTFY_TOPIC: ${{ secrets.NTFY_TOPIC }}
        run: python check_promo.py

      - name: Commit updated state
        run: |
          git config user.name "piso-sale-bot"
          git config user.email "actions@users.noreply.github.com"
          git add seen.json
          git diff --quiet && git diff --staged --quiet || git commit -m "Update seen.json [skip ci]"
          git push
